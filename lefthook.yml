# QA baseline for the Skills portfolio — CANONICAL REFERENCE
#
# This file is the source of truth. Every plugin/marketplace repo in the
# portfolio carries a byte-identical copy as its own `lefthook.yml`, and
# `scripts/check-plugin-consistency.py` fails if any copy drifts from this one.
#
# WHY A COPY AND NOT AN INCLUDE
#   lefthook supports `remotes:` and `extends:`, and neither works here:
#     - `remotes:` would point at this meta-repo, which lives ONLY on the private
#       git server. External contributors to the public plugin repos could not
#       fetch it, so their hooks would silently do nothing.
#     - `extends: ../qa/...` resolves to a sibling path that exists only in this
#       workspace layout, not in a fresh clone of a single plugin repo.
#   Each repo's config must therefore stand alone. The consistency gate replaces
#   the include with a drift check.
#
# INSTALL (per repo, once per clone — hooks are not version-controlled):
#   lefthook install
#
# See docs/adr/0002-govern-skills-workspace-as-meta-project.md
# ---------------------------------------------------------------------------

pre-commit:
  parallel: true
  commands:
    # Secret scanning. Blocks the commit on detection (fail-closed).
    #
    # Homelab rules (hostnames, domain, IPs, git server, ssh port, username,
    # MAC addresses) live in a LOCAL gitleaks config resolved via the
    # GITLEAKS_CONFIG environment variable — deliberately NOT committed, because
    # the rules embed the very patterns they exist to keep out of public repos.
    # Without that env var (CI, a contributor's machine, a fresh checkout) only
    # gitleaks' default rules apply: real credentials are still caught, homelab
    # identifiers are not. CI is the enforcement backstop, not this hook.
    #
    # Fail-open if gitleaks is absent: these repos are public, and a missing
    # local tool must not block an external contribution.
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --verbose || {
            echo ""
            echo "⚠️  gitleaks detected secrets or homelab details in staged changes."
            echo "    Commit blocked. To bypass (NOT recommended): git commit --no-verify"
            exit 1
          }
          echo "✓ gitleaks: no secrets detected"
        else
          echo "⚠️  gitleaks not found — secret scan SKIPPED (install it: sudo port install gitleaks)"
        fi

    # Manifest spec compliance: plugin.json / marketplace.json / SKILL.md
    # frontmatter, against the installed Claude Code CLI's schema.
    #
    # Offline and auth-free (verified: runs with no HOME and no API key).
    # Complements the cross-plugin consistency gate with ZERO overlap — verified
    # 2026-07-16: `claude plugin validate` catches neither a version-lockstep
    # mismatch nor name != directory, which is precisely what the gate exists for.
    # This catches the other half: manifest drift as the Claude Code spec evolves.
    #
    # Note it exits 0 on warnings, so as a gate it blocks only hard errors.
    # Fail-open if the CLI is absent, for the same contributor reason as above.
    plugin-validate:
      glob:
        - ".claude-plugin/*.json"
        - "skills/**/SKILL.md"
      run: |
        if command -v claude >/dev/null 2>&1; then
          claude plugin validate .
        else
          echo "⚠️  claude CLI not found — manifest validation SKIPPED"
        fi

    # A pin commit must record itself.
    #
    # A marketplace SHA-pins each plugin source, so moving a SHA IS the release: it changes
    # what every installation gets, while the plugin's own repo shows no activity at all.
    # The convention is to move the SHA, bump the manifest `version`, and add a CHANGELOG
    # entry naming the new pin -- and the convention was the only thing enforcing it. Seven
    # pin commits in `jrjsmrtn-skills` moved a SHA alone, and the changelog silently stopped
    # describing what the marketplace served.
    #
    # Deliberately scoped to SHA CHANGES, not to the file: editing a description, adding a
    # homepage or reordering entries is not a release and is not gated. Inert where there is
    # nothing to check -- a marketplace pinning by `ref:` has no SHA to move, and the plugin
    # repos carry no marketplace.json for the glob to match.
    #
    # Fail-open if python3 is absent, for the same contributor reason as the commands above.
    pin-recorded:
      glob: ".claude-plugin/marketplace.json"
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "⚠️  python3 not found — pin/changelog check SKIPPED"
          exit 0
        fi
        python3 - <<'PIN_CHECK'
        import json, subprocess, sys

        MANIFEST = ".claude-plugin/marketplace.json"

        def read(rev):
            p = subprocess.run(["git", "show", f"{rev}:{MANIFEST}"],
                               capture_output=True, text=True)
            if p.returncode != 0:
                return None
            try:
                return json.loads(p.stdout)
            except json.JSONDecodeError:
                return None

        def pins(doc):
            out = {}
            for entry in doc.get("plugins", []):
                src = entry.get("source")
                if isinstance(src, dict) and src.get("sha"):
                    out[entry.get("name")] = src["sha"]
            return out

        staged, head = read(""), read("HEAD")
        if staged is None:
            print("⚠️  staged marketplace.json is unreadable — pin check SKIPPED")
            sys.exit(0)
        if head is None:
            print("✓ pin/changelog: no previous manifest to compare (initial commit)")
            sys.exit(0)

        before, after = pins(head), pins(staged)
        moved = {n: s for n, s in after.items() if s != before.get(n)}
        if not moved:
            print("✓ pin/changelog: no SHA moved")
            sys.exit(0)

        files = subprocess.run(["git", "diff", "--cached", "--name-only"],
                               capture_output=True, text=True).stdout.split()
        changelog = subprocess.run(["git", "show", ":CHANGELOG.md"],
                                   capture_output=True, text=True)
        text = changelog.stdout if changelog.returncode == 0 else ""

        faults = []
        if "CHANGELOG.md" not in files:
            faults.append("CHANGELOG.md is not staged")
        if staged.get("version") == head.get("version"):
            faults.append(f"manifest version did not move (still {staged.get('version')})")
        for name, sha in sorted(moved.items()):
            if sha[:7] not in text:
                faults.append(f"{name}: new pin {sha[:7]} is not cited in the staged CHANGELOG")

        if faults:
            print(f"✘ {len(moved)} pin(s) moved without recording the release:")
            for f in faults:
                print(f"    {f}")
            print("\n  Moving a SHA changes what every installation gets, and the plugin's own")
            print("  repo shows nothing. Bump the manifest `version` and add a CHANGELOG entry")
            print("  naming the new pin. To bypass (NOT recommended): git commit --no-verify")
            sys.exit(1)

        print(f"✓ pin/changelog: {len(moved)} pin(s) moved, version bumped and all cited")
        PIN_CHECK

    # A plugin must not contradict itself about its own version.
    #
    # `plugin.json` carries the plugin version and every `skills/*/SKILL.md` repeats it in
    # `metadata.version`. The convention is lockstep; nothing in the plugin repo enforced it.
    # okf-skills 0.1.11 shipped with all three SKILL.md files still declaring 0.1.10, and the
    # v0.1.11 tag records that tree -- a released artifact disagreeing with itself.
    #
    # The pair IS checked, by check-plugin-consistency.py, but that lives in the meta-project
    # and runs on ITS commits. A plugin repo can therefore publish the drift and only find out
    # on the next unrelated workspace commit, which is exactly what happened. `claude plugin
    # validate` does not cover it either -- see the note on plugin-validate above.
    #
    # Reads the STAGED content, so it gates what is being committed rather than the worktree.
    # Inert where there is nothing to check: a marketplace repo carries no plugin.json, and a
    # plugin with no skills has no version to repeat.
    #
    # Fail-open if python3 is absent, for the same contributor reason as the commands above.
    version-lockstep:
      glob:
        - ".claude-plugin/plugin.json"
        - "skills/**/SKILL.md"
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "⚠️  python3 not found — version lockstep check SKIPPED"
          exit 0
        fi
        python3 - <<'LOCKSTEP'
        import json, re, subprocess, sys

        def staged(path):
            p = subprocess.run(["git", "show", f":{path}"], capture_output=True, text=True)
            return p.stdout if p.returncode == 0 else None

        manifest = staged(".claude-plugin/plugin.json")
        if manifest is None:
            print("✓ version lockstep: no plugin.json (not a plugin repo)")
            sys.exit(0)
        try:
            declared = json.loads(manifest).get("version")
        except json.JSONDecodeError:
            print("⚠️  staged plugin.json is unreadable — lockstep check SKIPPED")
            sys.exit(0)
        if not declared:
            print("⚠️  plugin.json declares no version — lockstep check SKIPPED")
            sys.exit(0)

        skills = subprocess.run(["git", "ls-files", "skills/*/SKILL.md"],
                                capture_output=True, text=True).stdout.split()
        if not skills:
            print(f"✓ version lockstep: {declared}, no skills to check")
            sys.exit(0)

        # metadata.version inside the YAML frontmatter only -- the body of a skill may
        # legitimately contain a `version:` line as example content, and does.
        FRONTMATTER = re.compile(r"\A---\n(.*?)\n---\n", re.S)
        VERSION = re.compile(r"^\s+version:\s*[\"']?([^\"'\s]+)", re.M)

        faults = []
        for path in sorted(skills):
            text = staged(path)
            if text is None:
                continue
            fm = FRONTMATTER.match(text)
            if not fm:
                faults.append(f"{path}: no YAML frontmatter")
                continue
            found = VERSION.search(fm.group(1))
            if not found:
                faults.append(f"{path}: frontmatter declares no metadata.version")
            elif found.group(1) != declared:
                faults.append(f"{path}: {found.group(1)} != plugin.json {declared}")

        if faults:
            print(f"✘ version lockstep broken against plugin.json {declared}:")
            for f in faults:
                print(f"    {f}")
            print("\n  A release that bumps the manifest and leaves the skills behind ships an")
            print("  artifact that contradicts itself, and the tag records it. Bump every")
            print("  SKILL.md `metadata.version` to match. To bypass (NOT recommended):")
            print("  git commit --no-verify")
            sys.exit(1)

        print(f"✓ version lockstep: {declared} across {len(skills)} skill(s)")
        LOCKSTEP
